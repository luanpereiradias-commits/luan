














<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Slot Machine Educativo</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
        }

        h1 {
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
        }

        .maquina {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 5px solid #f1c40f;
            text-align: center;
        }

        .roletas {
            display: flex;
            gap: 15px;
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 3px solid #2c3e50;
        }

        .roleta {
            width: 80px;
            height: 80px;
            background-color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        button {
            background-color: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 5px #d35400;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px #d35400;
        }

        button:hover {
            background-color: #f39c12;
        }

        #resultado {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 35px;
        }
    </style>
</head>
<body>

    <h1>Cassino Lab 🎰</h1>
    
    <div class="maquina">
        <div class="roletas">
            <div class="roleta" id="r1">🐯</div>
            <div class="roleta" id="r2">🐯</div>
            <div class="roleta" id="r3">🐯</div>
        </div>
        
        <button id="btn-girar" onclick="girar()">GIRAR!</button>
        
        <div id="resultado">Tente a sorte!</div>
    </div>

    <script>
        // Array com os emojis (simbolizando os ícones do jogo)
        const emojis = ['🐯', '🍊', '🪙', '💎', '🔥'];

        function girar() {
            const btn = document.getElementById('btn-girar');
            const res = document.getElementById('resultado');
            
            // Desativa o botão temporariamente para simular o giro
            btn.disabled = true;
            res.innerText = "Girando...";

            // Efeito visual rápido de mudança de ícones (Simulação)
            let voltas = 0;
            const intervalo = setInterval(() => {
                document.getElementById('r1').innerText = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('r2').innerText = emojis[Math.floor(Math.random() * emojis.length)];
                document.getElementById('r3').innerText = emojis[Math.floor(Math.random() * emojis.length)];
                voltas++;

                if (voltas > 10) {
                    clearInterval(intervalo);
                    verificarResultado();
                }
            }, 100);
        }

        function verificarResultado() {
            const r1 = document.getElementById('r1').innerText;
            const r2 = document.getElementById('r2').innerText;
            const r3 = document.getElementById('r3').innerText;
            const res = document.getElementById('resultado');
            const btn = document.getElementById('btn-girar');

            // Lógica de vitória: se todos os três forem iguais
            if (r1 === r2 && r2 === r3) {
                if (r1 === '🐯') {
                    res.innerHTML = "<span style='color: #2ecc71;'>🏆 SUPER GANHO DO TIGRE! 🏆</span>";
                } else {
                    res.innerHTML = "<span style='color: #2ecc71;'>🎉 Você ganhou! 🎉</span>";
                }
            } else {
                res.innerHTML = "<span style='color: #e74c3c;'>Tente novamente!</span>";
            }

            // Reativa o botão
            btn.disabled = false;
        }
    </script>
</body>
</html>
